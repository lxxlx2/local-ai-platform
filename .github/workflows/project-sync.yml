name: Project Sync

on:
  issues:
    types: [opened, reopened, closed, assigned, unassigned, labeled, unlabeled, edited]
  pull_request:
    types: [opened, reopened, closed, synchronize, ready_for_review, converted_to_draft, edited, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      content_url:
        description: Issue or pull request URL to reconcile
        required: true
        type: string
      status:
        description: Optional Status override
        required: true
        default: keep
        type: choice
        options: [keep, Todo, In Progress, Done]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
      PROJECT_NUMBER: "1"
      EXPECTED_PROJECT_TITLE: Local AI Platform
      EXPECTED_REPOSITORY: lxxlx2/local-ai-platform
    steps:
      - name: Reconcile project item
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::warning::PROJECT_SYNC_DEFERRED rc=$rc"; exit 0' ERR
          defer() { echo "::warning::PROJECT_SYNC_DEFERRED reason=$1"; exit 0; }

          [[ -n "${GH_TOKEN:-}" ]] || defer missing_token
          [[ "$GITHUB_REPOSITORY" == "$EXPECTED_REPOSITORY" ]] || defer repository_guard

          ACTION="$(jq -r '.action // ""' "$GITHUB_EVENT_PATH")"
          TARGET_STATUS=""
          case "$GITHUB_EVENT_NAME" in
            issues)
              CONTENT_URL="$(jq -r '.issue.html_url' "$GITHUB_EVENT_PATH")"
              case "$ACTION" in
                opened) TARGET_STATUS="Todo" ;;
                reopened|assigned) TARGET_STATUS="In Progress" ;;
                closed) TARGET_STATUS="Done" ;;
              esac
              ;;
            pull_request)
              CONTENT_URL="$(jq -r '.pull_request.html_url' "$GITHUB_EVENT_PATH")"
              case "$ACTION" in
                opened|reopened|synchronize|ready_for_review|converted_to_draft) TARGET_STATUS="In Progress" ;;
                closed) TARGET_STATUS="Done" ;;
              esac
              ;;
            workflow_dispatch)
              CONTENT_URL="$(jq -r '.inputs.content_url' "$GITHUB_EVENT_PATH")"
              MANUAL_STATUS="$(jq -r '.inputs.status // "keep"' "$GITHUB_EVENT_PATH")"
              [[ "$MANUAL_STATUS" == keep ]] || TARGET_STATUS="$MANUAL_STATUS"
              ;;
            *) defer unsupported_event ;;
          esac

          [[ "$CONTENT_URL" == https://github.com/${EXPECTED_REPOSITORY}/issues/* || "$CONTENT_URL" == https://github.com/${EXPECTED_REPOSITORY}/pull/* ]] || defer content_url_guard

          PROJECT_JSON="$(gh project view "$PROJECT_NUMBER" --owner '@me' --format json 2>/dev/null || true)"
          jq -e . >/dev/null 2>&1 <<<"$PROJECT_JSON" || defer project_lookup
          PROJECT_ID="$(jq -r '.id // empty' <<<"$PROJECT_JSON")"
          PROJECT_TITLE="$(jq -r '.title // empty' <<<"$PROJECT_JSON")"
          [[ -n "$PROJECT_ID" && "$PROJECT_TITLE" == "$EXPECTED_PROJECT_TITLE" ]] || defer project_guard
          echo "PROJECT_RESOLVED id=$PROJECT_ID title=$PROJECT_TITLE"

          gh project item-add "$PROJECT_NUMBER" --owner '@me' --url "$CONTENT_URL" >/dev/null 2>&1 || true

          ITEMS="$(gh project item-list "$PROJECT_NUMBER" --owner '@me' --limit 1000 --format json)"
          FIELDS="$(gh project field-list "$PROJECT_NUMBER" --owner '@me' --limit 100 --format json)"
          ITEM_ID="$(jq -r --arg url "$CONTENT_URL" 'first(.items[] | select(.content.url == $url) | .id) // empty' <<<"$ITEMS")"
          [[ -n "$ITEM_ID" ]] || defer item_not_found

          META="$(python3 - "$GITHUB_EVENT_PATH" "$GITHUB_EVENT_NAME" <<'PY'
          import json, re, sys
          event = json.load(open(sys.argv[1], encoding='utf-8'))
          name = sys.argv[2]
          obj = event.get('issue') if name == 'issues' else event.get('pull_request') if name == 'pull_request' else {}
          obj = obj or {}
          meta = {}
          aliases = {'stage':'stage','workstream':'workstream','priority':'priority','phase':'phase','progress':'progress','blocker':'blocker','next':'next_action','next-action':'next_action'}
          for label in obj.get('labels', []):
              text = label.get('name','') if isinstance(label, dict) else ''
              if ':' in text:
                  k,v = text.split(':',1); key = aliases.get(k.strip().lower())
                  if key and v.strip(): meta[key] = v.strip()
          body = obj.get('body') or ''
          for m in re.finditer(r'(?im)^\s*Project-(Stage|Workstream|Priority|Phase|Progress|Blocker|Next-Action)\s*:\s*(.*?)\s*$', body):
              key = aliases[m.group(1).lower()]; value = m.group(2).strip()
              if value: meta[key] = value
          try:
              if 'progress' in meta:
                  n=float(meta['progress']); meta['progress']=n if 0 <= n <= 100 else None
          except Exception: meta.pop('progress', None)
          meta = {k:v for k,v in meta.items() if v is not None}
          print(json.dumps(meta, ensure_ascii=False))
          PY
          )"

          field_id() { jq -r --arg n "$1" 'first(.fields[] | select((.name|ascii_downcase)==($n|ascii_downcase)) | .id) // empty' <<<"$FIELDS"; }
          option_id() { jq -r --arg f "$1" --arg o "$2" 'first(.fields[] | select((.name|ascii_downcase)==($f|ascii_downcase)) | .options[]? | select((.name|ascii_downcase)==($o|ascii_downcase)) | .id) // empty' <<<"$FIELDS"; }
          set_select() { local f="$1" v="$2" fid oid; [[ -n "$v" ]] || return 0; fid="$(field_id "$f")"; [[ -n "$fid" ]] || { echo "PROJECT_SYNC_SKIP missing_field=$f"; return 0; }; oid="$(option_id "$f" "$v")"; [[ -n "$oid" ]] || { echo "PROJECT_SYNC_SKIP missing_option=$f:$v"; return 0; }; gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" --field-id "$fid" --single-select-option-id "$oid" >/dev/null; }
          set_text() { local f="$1" v="$2" fid; [[ -n "$v" ]] || return 0; fid="$(field_id "$f")"; [[ -n "$fid" ]] || { echo "PROJECT_SYNC_SKIP missing_field=$f"; return 0; }; gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" --field-id "$fid" --text "$v" >/dev/null; }
          set_number() { local f="$1" v="$2" fid; [[ -n "$v" ]] || return 0; fid="$(field_id "$f")"; [[ -n "$fid" ]] || { echo "PROJECT_SYNC_SKIP missing_field=$f"; return 0; }; gh project item-edit --id "$ITEM_ID" --project-id "$PROJECT_ID" --field-id "$fid" --number "$v" >/dev/null; }

          set_select "Status" "$TARGET_STATUS"
          set_select "Stage" "$(jq -r '.stage // empty' <<<"$META")"
          set_select "Workstream" "$(jq -r '.workstream // empty' <<<"$META")"
          set_select "Priority" "$(jq -r '.priority // empty' <<<"$META")"
          set_text "Phase" "$(jq -r '.phase // empty' <<<"$META")"
          set_number "Progress" "$(jq -r '.progress // empty' <<<"$META")"
          set_text "Blocker" "$(jq -r '.blocker // empty' <<<"$META")"
          set_text "Next Action" "$(jq -r '.next_action // empty' <<<"$META")"

          echo "PROJECT_SYNC_OK project=$EXPECTED_PROJECT_TITLE item=$CONTENT_URL status=${TARGET_STATUS:-unchanged}"
